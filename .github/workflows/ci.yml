# Gabarit fourni dans le fork de référence - workflow d'amorce (build + lint uniquement).
# Les étudiants ajoutent sast.yml (S3), supply-chain.yml (S4), dast.yml (S5) à côté.
#
# Versions vérifiées le 2026-09-05 :
#   - actions/checkout@v7      (dernier tag publié : v7.0.1)
#   - jdx/mise-action@v4       (versions Node.js et npm définies dans mise.toml)
name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- npm ci
      - run: mise exec -- npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- npm ci
      - run: mise exec -- npm run lint
